<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="myflames-version" content="__MYFLAMES_VERSION__" />
    <meta name="theme-color" content="#f5f5f7" />
    <link
      rel="icon"
      type="image/png"
      href="../../docs/brand/myflames-icon-v3.png?v=3"
    />
    <title>myflames · Performance workspace</title>
    <script>
      try {
        var t = localStorage.getItem("myflames.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
