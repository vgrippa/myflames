<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,sans-serif" role="img" aria-label="Tokens to ask an AI to fix one slow query: raw plan 2,110 tokens versus myflames digest 521 tokens, 4 times fewer, about 7.90 dollars saved per 1,000 queries">
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#1c2330">Tokens to ask an AI to fix one slow query</text>
  <text x="32" y="66" font-size="13" fill="#5a6270">Measured against Claude Opus 4.8 (real <tspan font-style="italic">count_tokens</tspan>), 2026-06-05. Lower is cheaper.</text>

  <!-- Raw plan bar: 2,110 tokens -> 600px (scale 600/2110) -->
  <text x="32" y="120" font-size="14" fill="#1c2330">Raw <tspan font-weight="600">EXPLAIN</tspan> plan + your question</text>
  <rect x="32" y="130" width="600" height="34" rx="5" fill="#d9663f"/>
  <text x="644" y="152" font-size="15" font-weight="700" fill="#b34a28">2,110 tokens</text>

  <!-- Digest bar: 521 tokens -> 148px -->
  <text x="32" y="200" font-size="14" fill="#1c2330"><tspan font-weight="600">myflames</tspan> digest + your question</text>
  <rect x="32" y="210" width="148" height="34" rx="5" fill="#3f9d5b"/>
  <text x="192" y="232" font-size="15" font-weight="700" fill="#2c7a44">521 tokens</text>

  <!-- Savings callout -->
  <rect x="32" y="266" width="696" height="38" rx="8" fill="#f1f7f3" stroke="#cfe6d7"/>
  <text x="48" y="290" font-size="14.5" fill="#1c2330">
    <tspan font-weight="700" fill="#2c7a44">4.0&#215; fewer tokens</tspan>
    <tspan dx="2">(75% less)</tspan>
    <tspan dx="10">&#183;</tspan>
    <tspan dx="10" font-weight="700">~$7.90 saved per 1,000 queries</tspan>
    <tspan dx="2" fill="#5a6270">(Opus 4.8 input; ~$4.80 on Sonnet 4.6)</tspan>
  </text>
</svg>
