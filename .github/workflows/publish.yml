name: Publish to PyPI

# Builds the sdist + wheel and publishes to PyPI using a Trusted Publisher
# (OpenID Connect) — no API token or password is stored anywhere. Configure
# the matching publisher on PyPI: project `myflames`, owner `vgrippa`,
# repository `myflames`, workflow `publish.yml`, environment `pypi`.
#
# Fires automatically when a GitHub Release is published, and can be run
# manually with the tag to publish. Both paths check out the tag (never a
# moving master) and refuse to publish unless the tag is "v" + the version
# in pyproject.toml at that checkout.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v3.4.3"
        required: true

concurrency:
  # A running publish must never be cancelled mid-upload, and two runs for
  # the same tag must never overlap.
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate the tag
        run: |
          # The whole value must match: a line-based check (grep) would let
          # extra text reach later steps.
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a release tag (expected vX.Y.Z): $TAG"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Tag must match the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $version at that tag; refusing to publish."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workspace/package-lock.json
      - name: Build the workspace
        working-directory: apps/workspace
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci
          npm run build
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check packaged workspace assets
        run: python scripts/check_ui_assets.py dist/*.whl dist/*.tar.gz
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
