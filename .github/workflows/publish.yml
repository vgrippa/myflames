name: Publish to PyPI

# Builds the sdist + wheel and publishes to PyPI using a Trusted Publisher
# (OpenID Connect) — no API token or password is stored anywhere. Configure
# the matching publisher on PyPI: project `myflames`, owner `vgrippa`,
# repository `myflames`, workflow `publish.yml`, environment `pypi`.
#
# Fires automatically when a GitHub Release is published, and can be run
# manually (workflow_dispatch) to publish the current version on master.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
