name: Fixtures drift

# Slice 6 / P1: nightly regen against the floating mysql:8.4,
# mariadb:11.4 and mariadb:10.11 Docker tags. The tags float on purpose:
# this job exists to notice upstream image changes. It fails when
# `test/fixtures/` diverges from what the generator scripts produce
# against the current images, so a DBA comparing myflames output to
# their real 8.4.x server never sees silent disagreements caused by
# stale fixtures.
#
# Cost note: this boots two Docker service containers per run. Keep
# it on a schedule (daily) rather than every PR. Use
# `workflow_dispatch` for manual reruns after intentional schema
# changes.

on:
  schedule:
    # 03:14 UTC daily — off-peak, deterministic.
    - cron: "14 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  regenerate-and-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # services:
    #   We intentionally do NOT declare services: at the job level.
    #   The generator scripts (scripts/generate-fixtures.sh and
    #   scripts/generate-mariadb-fixtures.sh) bring up their own
    #   ephemeral Docker containers so this workflow mirrors exactly
    #   what a contributor runs locally.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Regenerate MySQL fixtures
        run: ./scripts/generate-fixtures.sh

      - name: Regenerate MariaDB fixtures
        run: ./scripts/generate-mariadb-fixtures.sh

      - name: Show raw diff (informational, includes timing noise)
        run: git --no-pager diff --stat -- test/fixtures/

      - name: Fail on structural drift
        # `actual_*_ms` and the MariaDB `r_*_time_ms` family are wall-clock
        # measurements that vary every run, so a literal `git diff` is too
        # noisy. The script strips those fields from both HEAD and the
        # regenerated tree before comparing — only structural drift fails.
        run: |
          if ! python3 scripts/check_fixture_drift.py; then
            echo "::error::Fixtures drifted from the freshly regenerated mysql:8.4 / mariadb:11.4 / mariadb:10.11 output."
            echo "Run ./scripts/generate-fixtures.sh and ./scripts/generate-mariadb-fixtures.sh locally, commit, and re-run."
            exit 1
          fi
