name: Live connector integration

# Live tests against real MySQL 8.4 and MariaDB 11.4 containers that the
# test classes boot themselves (test_connector_integration.py,
# test_schema_versions_live.py). MYFLAMES_REQUIRE_LIVE=1 turns a missing
# Docker daemon or mysql client, a failed image pull and a container that
# never becomes ready into a failure, so this job can never pass with
# zero live tests.
#
# Cost note: every PR boots DB containers. If that becomes too expensive
# for the project, downgrade to `on: schedule:` only and leave PRs with
# just the unit matrix in test.yml.

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        engine:
          - { name: mysql,   connector_class: TestLiveMySQL84,    schema_class: TestLiveSchemaVersionsMySQL84 }
          - { name: mariadb, connector_class: TestLiveMariaDB114, schema_class: TestLiveSchemaVersionsMariaDB114 }

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The runner image already ships the MySQL client with its MySQL server.
      # Installing it from apt when the mirror has a newer version also
      # upgrades that server, whose post-install restart then fails.
      - name: Install MySQL client (for mysqladmin in the runner)
        run: command -v mysqladmin > /dev/null || (sudo apt-get update && sudo apt-get install -y mysql-client)

      - name: Run live tests (${{ matrix.engine.name }})
        env:
          MYFLAMES_REQUIRE_LIVE: "1"
        run: |
          python3 -m unittest discover -s test -p "test_connector_integration.py" -k "${{ matrix.engine.connector_class }}" -v
          python3 -m unittest discover -s test -p "test_schema_versions_live.py" -k "${{ matrix.engine.schema_class }}" -v
