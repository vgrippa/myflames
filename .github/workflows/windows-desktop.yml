name: Windows desktop

# Builds the unsigned Windows x64 installer (an NSIS .exe) from the Electron
# launcher and a PyInstaller backend, runs the packaged smoke on the unpacked
# app and on a silent install on the runner, verifies silent uninstall, and
# uploads the installer, its checksum and the install evidence as a workflow
# artifact. PyInstaller cannot cross-compile, so the Windows backend is built
# here; releases attach this installer and its .sha256 as an unsigned preview
# (see apps/desktop/README.md).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - "myflames/**"
      - "apps/workspace/**"
      - "docs/brand/myflames-app-logo.png"
      - "scripts/check_ui_assets.py"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - "myflames/**"
      - "apps/workspace/**"
      - "docs/brand/myflames-app-logo.png"
      - "scripts/check_ui_assets.py"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/workspace/package-lock.json
      - name: Build the workspace
        working-directory: apps/workspace
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci
          npm run build
      - name: Build the backend
        run: |
          python -m venv local/desktop-build-venv
          local/desktop-build-venv/Scripts/python.exe -m pip install -r apps/desktop/requirements-build.txt
          local/desktop-build-venv/Scripts/python.exe apps/desktop/scripts/build-backend.py
          apps/desktop/build/backend/myflames-backend/myflames-backend.exe --version
      - name: Install launcher dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Launcher tests
        working-directory: apps/desktop
        run: npm test
      # The bundled MySQL client: the archive pinned in mysql-client.lock.json,
      # cached by its SHA-256 and verified again before anything is extracted.
      # The Visual C++ runtime DLLs come from this runner's Visual Studio.
      - name: MySQL client archive digest
        id: mysql-client
        run: echo "sha256=$(node -p "require('./apps/desktop/mysql-client.lock.json').archives['win32-x64'].sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: apps/desktop/build/mysql-client-cache
          key: mysql-client-win32-x64-${{ steps.mysql-client.outputs.sha256 }}
      - name: Fetch the MySQL client
        run: python apps/desktop/scripts/fetch-mysql-client.py --platform win32-x64
      - name: Build the installer
        working-directory: apps/desktop
        run: npm run package:win
      # The unpacked app is what the installer contains.
      - name: Packaged smoke
        id: unpacked-smoke
        working-directory: apps/desktop
        run: npm run smoke -- dist/win-unpacked
      - name: Install the built installer silently
        id: install
        working-directory: apps/desktop
        run: |
          shopt -s nullglob
          installers=(dist/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one installer in apps/desktop/dist, found: ${installers[*]}" >&2
            exit 1
          fi
          python - "${installers[0]}" <<'EOF'
          import subprocess, sys
          subprocess.run([sys.argv[1], "/S"], check=True)
          EOF
      - name: Assert installed executable and Start menu shortcut
        id: verify-install
        run: |
          install_dir="$(cygpath -u "$LOCALAPPDATA")/Programs/myflames-desktop"
          exe="$install_dir/myflames.exe"
          uninstaller="$install_dir/Uninstall myflames.exe"
          shortcut="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/myflames.lnk"
          if [ ! -f "$exe" ]; then
            echo "Missing installed executable: $exe" >&2
            ls -la "$LOCALAPPDATA/Programs" || true
            exit 1
          fi
          if [ ! -f "$uninstaller" ]; then
            echo "Missing uninstaller: $uninstaller" >&2
            ls -la "$install_dir" || true
            exit 1
          fi
          if [ ! -f "$shortcut" ]; then
            echo "Missing Start menu shortcut: $shortcut" >&2
            ls -la "$APPDATA/Microsoft/Windows/Start Menu/Programs" || true
            exit 1
          fi
      - name: Installed smoke
        id: installed-smoke
        working-directory: apps/desktop
        run: node scripts/smoke.cjs "$LOCALAPPDATA/Programs/myflames-desktop"
      - name: Uninstall silently and assert removal
        id: uninstall
        run: |
          install_dir="$(cygpath -u "$LOCALAPPDATA")/Programs/myflames-desktop"
          uninstaller="$install_dir/Uninstall myflames.exe"
          shortcut="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/myflames.lnk"
          python - "$(cygpath -w "$uninstaller")" <<'EOF'
          import subprocess, sys
          subprocess.run([sys.argv[1], "/currentuser", "/S"], check=True)
          EOF
          # The NSIS uninstaller stub copies itself to %TEMP%, spawns that copy
          # to remove the install folder and shortcuts, and exits immediately.
          for _ in $(seq 1 60); do
            if [ ! -e "$install_dir" ] && [ ! -e "$shortcut" ]; then
              break
            fi
            sleep 0.5
          done
          if [ -e "$install_dir" ]; then
            echo "Install folder still exists after uninstall: $install_dir" >&2
            ls -la "$install_dir" || true
            exit 1
          fi
          if [ -e "$shortcut" ]; then
            echo "Start menu shortcut still exists after uninstall: $shortcut" >&2
            exit 1
          fi
      - name: Checksum
        working-directory: apps/desktop/dist
        run: for file in *-setup.exe; do sha256sum "$file" > "$file.sha256"; cat "$file.sha256"; ls -l "$file"; done
      - name: Write install evidence
        working-directory: apps/desktop/dist
        env:
          STEP_UNPACKED_SMOKE: ${{ steps.unpacked-smoke.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_VERIFY_INSTALL: ${{ steps.verify-install.outcome }}
          STEP_INSTALLED_SMOKE: ${{ steps.installed-smoke.outcome }}
          STEP_UNINSTALL: ${{ steps.uninstall.outcome }}
        run: |
          python - <<'EOF'
          import glob, hashlib, json, os
          installers = sorted(glob.glob("*-setup.exe"))
          if len(installers) != 1:
              raise SystemExit(f"Expected 1 installer in apps/desktop/dist, found {installers!r}")
          installer = installers[0]
          digest = hashlib.sha256(open(installer, "rb").read()).hexdigest()
          def status(outcome):
              return "pass" if outcome == "success" else "fail"
          evidence = {
              "commit": os.environ["GITHUB_SHA"],
              "installer": installer,
              "sha256": digest,
              "steps": {
                  "unpacked_smoke": status(os.environ.get("STEP_UNPACKED_SMOKE")),
                  "install": status(os.environ.get("STEP_INSTALL")),
                  "verify_install": status(os.environ.get("STEP_VERIFY_INSTALL")),
                  "installed_smoke": status(os.environ.get("STEP_INSTALLED_SMOKE")),
                  "uninstall": status(os.environ.get("STEP_UNINSTALL")),
              },
          }
          with open("windows-install-evidence.json", "w", encoding="utf-8") as fh:
              json.dump(evidence, fh, indent=2)
              fh.write("\n")
          print(open("windows-install-evidence.json", encoding="utf-8").read(), end="")
          if any(v != "pass" for v in evidence["steps"].values()):
              raise SystemExit(1)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: myflames-windows-x64
          path: |
            apps/desktop/dist/*-setup.exe
            apps/desktop/dist/*-setup.exe.sha256
            apps/desktop/dist/windows-install-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-screenshot
          path: apps/desktop/smoke-results/desktop.png
          if-no-files-found: ignore
